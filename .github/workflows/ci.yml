name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Verify environment
        run: |
          python --version
          pipenv --version
      - name: Install dependencies
        run: pipenv sync --dev
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_starter_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_starter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fastapi_starter_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fastapi_starter_test
      JWT_SECRET_KEY: ci-test-jwt-secret-at-least-32-bytes-long
      CSRF_SECRET_KEY: ci-test-csrf-secret-at-least-32-bytes-long

      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_SENDER_EMAIL: noreply@example.com
      SMTP_USE_STARTTLS: 'false'

      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_RESET_URL: http://localhost:5173/reset-password

      COOKIE_SECURE: 'false'
      REDIS_URL: redis://localhost:6379/0
