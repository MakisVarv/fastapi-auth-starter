name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Verify environment
        run: |
          python --version
          pipenv --version
      - name: Install dependencies
        run: pipenv sync --dev
