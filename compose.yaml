services:
  nginx:
    image: nginx:stable-alpine

    ports:
      - '127.0.0.1:8000:80'

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      default:
        ipv4_address: 172.30.200.10

    depends_on:
      api:
        condition: service_started

  api:
    build: .

    env_file: .env

    environment:
      DATABASE_URL: 'postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:?POSTGRES_DB required}'
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      FORWARDED_ALLOW_IPS: '172.30.200.10'

    depends_on:
      init:
        condition: service_completed_successfully

      redis:
        condition: service_started

      mailpit:
        condition: service_started

  init:
    build: .

    command: ['sh', 'scripts/init.sh']

    env_file: .env

    environment:
      DATABASE_URL: 'postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:?POSTGRES_DB required}'

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:latest

    ports:
      - '127.0.0.1:8026:8025'

volumes:
  postgres_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.200.0/24
