services:
  api:
    build: .
    ports:
      - '8000:8000'
    env_file: .env
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_starter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
